<title>Errands</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151412">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one-thumb phone app in the Keyrose look. Brand header band, scrolling view, add bar + tab bar pinned to the bottom. Single dark look: the brand lives on Graphite. */
:root{
  --bg:#1C1B19; --surface:#25231F; --raised:#2F2C27; --band:#151412; --line:#3A3631;
  --fg:#EFEBE5; --muted:#B3ACA2; --faint:#8A847B;
  --gold:#C9A45C; --gold-light:#DCC089; --accent:#C9A45C; --accent-ink:#151412;
  --good:#8DBA8E; --danger:#DD8270; --est:#B3ACA2; --cart:#22251F;
  --f-display:"Montserrat",-apple-system,"Segoe UI",sans-serif;
  --f-body:"Montserrat",-apple-system,"Segoe UI",sans-serif;
  --r:12px; --fs:15px;
  color-scheme:dark;
}
:root.big{--fs:18px}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--fs);line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;align-items:center;gap:10px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6em;margin:0;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.sync{font-size:.75em;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.sync.off i{background:var(--gold)} .sync.busy i{background:var(--muted)}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}

main{padding-block:4px 180px}
.view{display:flex;flex-direction:column;gap:18px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 8px;border-radius:7px;color:var(--muted);font-size:.875em}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);font-weight:600}

.ghead{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:600;font-size:1.05em;padding:0 2px 6px}
.ghead .n{color:var(--faint);font-family:var(--f-body);font-weight:400;font-size:.85em}
.ghead .tag{font-family:var(--f-body);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;align-self:center}
.ghead .tag.est{color:var(--est)}
.group{display:flex;flex-direction:column}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.swipe{position:relative;overflow:hidden;border-top:1px solid var(--line)}
.swipe:first-child{border-top:0}
.under{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-weight:700;font-size:.85em}
.under .l{color:var(--good)} .under .r{color:var(--danger)}
.row{position:relative;background:var(--surface);display:flex;align-items:center;gap:12px;padding:12px 12px;min-height:52px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .sub{font-size:.8em;color:var(--muted);overflow-wrap:anywhere}
.qty{font-variant-numeric:tabular-nums;font-weight:600;color:var(--gold-light);margin-right:6px}
.catbtn{width:38px;height:38px;border-radius:10px;background:var(--raised);flex:none;display:grid;place-items:center;line-height:0}
.catbtn svg.lucide{width:20px;height:20px}
.catbtn.dot{width:28px;height:38px;background:none;margin-left:-6px}
.catbtn.dot i{display:block;width:12px;height:12px;border-radius:50%}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;color:var(--muted)}
.iconbtn[aria-pressed="true"]{color:var(--gold-light);background:var(--surface)}
.ctile{line-height:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75em;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}

.shop .row{min-height:64px;padding:14px 12px}
.box{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.row.incart{background:var(--cart)}
.row.incart .box{background:var(--good);border-color:var(--good)}
.row.incart .box::after{content:"";width:12px;height:7px;border:3px solid var(--accent-ink);border-top:0;border-right:0;transform:translateY(-2px) rotate(-45deg)}
.row.incart .name{color:var(--muted)}
.aisle{font-size:.75em;font-weight:600;border-radius:8px;padding:5px 9px;background:var(--band);border:1px solid var(--gold);color:var(--gold-light);white-space:nowrap;font-variant-numeric:tabular-nums}
.aisle.est{border-color:var(--line);color:var(--muted)}
.fold{display:flex;justify-content:space-between;width:100%;padding:12px;color:var(--muted);font-size:.875em;border-top:1px solid var(--line);background:var(--surface)}
.done .ghead{opacity:.55}

.progress{display:flex;flex-direction:column;gap:6px}
.pbar{height:8px;border-radius:99px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.pbar b{display:block;height:100%;background:var(--gold);transition:width .25s}
.ptext{display:flex;justify-content:space-between;font-size:.875em;color:var(--muted)}
.ptext strong{color:var(--fg);font-variant-numeric:tabular-nums}

.strip{display:flex;flex-direction:column;gap:8px}
.strip h2,.sect h2{font-size:11px;margin:0;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.sugg{flex:none;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.sugg button{padding:8px 4px 8px 12px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.sugg button small{font-size:.7em;color:var(--muted)}
.sugg .x{padding:8px 12px 8px 8px;color:var(--faint);font-size:1.1em}
.fav{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 12px}
.fav{display:inline-flex;align-items:center;gap:6px}.fav svg{color:var(--gold)}

.empty{text-align:center;color:var(--muted);padding:28px 12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--fg);font-size:1.15em;font-weight:700}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--band);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.addbar{display:flex;flex-direction:column;gap:8px;padding-block:10px 4px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.btn{background:var(--gold);color:var(--accent-ink);font-weight:600;border:1px solid var(--gold);border-radius:12px;padding:12px 16px;white-space:nowrap}
.btn.wide{width:100%;padding:15px;background:var(--band);color:var(--gold-light)}
.btn.ghost{background:var(--raised);border-color:var(--line);color:var(--fg)}
.btn.danger{background:none;border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.45}
.recent{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.recent button{flex:none;font-size:.85em;background:var(--raised);border-radius:999px;padding:6px 12px}
.shopbar{padding-block:10px 4px}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;color:var(--faint);text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.04em}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);width:max-content;z-index:30;background:var(--raised);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:.9em}
.toast button{color:var(--gold-light);font-weight:600;padding:4px 6px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:88%;overflow:auto;padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet>*{flex-shrink:0}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet h3{margin:0;font-size:1.25em;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{color:var(--muted);font-size:1em;padding:4px 8px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85em;color:var(--muted)}
label.f input,label.f select,label.f textarea,.inp{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--fg);font-size:var(--fs)}
textarea{min-height:120px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.catgrid button{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left}
.catgrid button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-light);font-weight:600}
.storepick{display:flex;flex-wrap:wrap;gap:8px}
.storepick button{border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--bg)}
.storepick button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-light);font-weight:600}
.money{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.money span{color:var(--muted);font-weight:700}
.money input{border:0;background:none;padding:14px 0;font-size:1.75em;font-weight:500;width:100%;font-variant-numeric:tabular-nums}
.money input:focus{outline:none}
.receipt{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.85em;color:var(--muted);display:flex;flex-direction:column;gap:3px;max-height:150px;overflow:auto}
.receipt div{display:flex;justify-content:space-between;gap:10px}

.sect{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.line{display:flex;align-items:center;gap:10px;justify-content:space-between}
.line + .line{border-top:1px solid var(--line);padding-top:10px}
.muted{color:var(--muted);font-size:.85em}
.link{color:var(--gold-light);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:1.75em;font-weight:500;color:var(--gold-light);font-variant-numeric:tabular-nums}
.stat span{font-size:.8em;color:var(--muted)}
.trip{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;text-align:left;width:100%}
.trip + .trip{border-top:1px solid var(--line)}
.trip .amt{font-weight:500;font-size:1.15em;font-variant-numeric:tabular-nums}
.catline{display:flex;align-items:center;gap:8px}
.catline select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 6px;color:var(--fg);max-width:34%}
.catline input.nm{flex:1;min-width:0}
.mini{background:var(--raised);border-radius:8px;padding:8px 10px;font-size:.85em;flex:none}
.hint{font-size:.8em;color:var(--faint)}
svg.lucide{width:1.15em;height:1.15em;stroke-width:2;flex:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mk{color:var(--gold);width:26px;height:26px;flex:none}
.gw{font-weight:400;letter-spacing:.32em;font-size:.8em;white-space:nowrap;color:var(--fg)}
.gw b{font-weight:400;color:var(--gold)}
.ctile{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#EFEBE5;flex:none}
.ctile.sm{width:26px;height:26px;border-radius:7px}
.ctile.sm svg.lucide{width:15px;height:15px}
.ghead .ctile{align-self:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

  <header class="wrap" id="hdr">
    <div class="hrow"><span class="brand"><svg class="mk" viewBox="0 0 100 100" aria-hidden="true"><use href="#c-o-bold"/></svg><span class="gw">KEY<b>ROSE</b></span></span><span class="sync" id="sync"><i></i><span>Loading</span></span><button class="iconbtn" id="searchbtn" aria-label="Search your list" aria-pressed="false" hidden><i data-lucide="search"></i></button></div>

      <a href="#setup" data-tab="setup"><i data-lucide="sliders-horizontal"></i>Settings</a>
    </nav>
  </div>
</div>

function lookup(key){
  const w = key.split(" ");

}

/* ---------- Text parsing ---------- */
const UNITS = "kg|g|lb|lbs|oz|l|ml|litre|liter|litres|liters|dozen|doz|pack|packs|pk|bag|bags|box|boxes|can|cans|bottle|bottles|bunch|bunches|jar|jars|loaf|loaves|carton|cartons|head|heads";
function splitItems(text){
  const out=[]; let cur="", depth=0;
  for(const ch of String(text)){
    if(ch==="("||ch==="[") depth++; if(ch===")"||ch==="]") depth=Math.max(0,depth-1);
    if((ch===","||ch==="\n"||ch===";")&&depth===0){ out.push(cur); cur=""; } else cur+=ch;
  }
  out.push(cur);
  return out.map(s=>s.trim()).filter(Boolean);
}
function isHeaderLine(s){
  const t=s.trim();
  if(!t) return true;
  if(/^\p{Extended_Pictographic}/u.test(t)) return true;
  if(/:$/.test(t)) return true;
  if(/^(grocery list|groceries|shopping list|list|to buy)$/i.test(t)) return true;
  return false;
}
function parseItem(raw){
  let s=raw.replace(/^[-*•☐☑✓✔︎•\s]+/,"").replace(/^\[\s?[xX ]?\s?\]\s*/,"").trim();
  let note="";
  const pm=s.match(/\(([^)]*)\)/); if(pm){ note=pm[1].trim(); s=s.replace(pm[0]," ").trim(); }
  const dm=s.match(/\s[-–—]\s(.+)$/); if(dm){ note=[note,dm[1].trim()].filter(Boolean).join(", "); s=s.slice(0,dm.index).trim(); }
  let qty="";
  let m;
  if((m=s.match(new RegExp("^(\\d+(?:[.,]\\d+)?)\\s*("+UNITS+")\\b\\.?\\s*(?:of\\s+)?(.+)$","i")))){ qty=m[1]+" "+m[2].toLowerCase(); s=m[3]; }
  else if((m=s.match(/^(\d+(?:[.,]\d+)?)\s*[x×]?\s+(.+)$/i))||(m=s.match(/^(\d+)\s*[x×](.+)$/i))){ qty=m[1]; s=m[2]; }
  else if((m=s.match(/^(.+?)\s*[x×]\s*(\d+)$/i))){ qty=m[2]; s=m[1]; }
  else if((m=s.match(new RegExp("^(.+?)\\s+(\\d+(?:[.,]\\d+)?)\\s*("+UNITS+")$","i")))){ qty=m[2]+" "+m[3].toLowerCase(); s=m[1]; }
  s=s.replace(/\s+/g," ").trim();
  if(!s) return null;
  const name=s.charAt(0).toUpperCase()+s.slice(1);
  return {name, qty, note, key:norm(s)};
}
function bumpQty(q){
  if(!q) return "2";
  const m=String(q).match(/^(\d+(?:\.\d+)?)(.*)$/);
  return m ? (Math.round((parseFloat(m[1])+1)*100)/100)+m[2] : q;
}

function write(path, body){ queue[path]= body===null?null:JSON.parse(JSON.stringify(body)); saveLocal(); flush(); }
const putItem = it => { S.items[it.id]=it; write("items/"+it.id,it); };
const delItem = id => { delete S.items[id]; write("items/"+id,null); };
const putTrip = t => { S.trips[t.id]=t; write("trips/"+t.id,t); };
const delTrip = id => { delete S.trips[id]; write("trips/"+id,null); };
let stateTimer=null;
function putState(){ write("app/state",S.state); }

function setSync(kind){
  syncState=kind;
  const el=document.getElementById("sync");
  const txt={local:"Saved on this device",ok:"Saved",busy:"Saving",off:"Offline, will save later"}[kind];
  el.className="sync "+(kind==="off"?"off":kind==="busy"?"busy":"");
  el.lastElementChild.textContent=txt;
}
function withTimeout(p,ms){ return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))]); }
async function flush(){
  if(!db){ setSync("local"); return; }
  if(flushing) return; flushing=true;
  try{
    for(;;){
      const paths=Object.keys(queue); if(!paths.length) break;
      setSync("busy");
      const path=paths[0], body=queue[path];
      try{
        if(body===null) await withTimeout(db.doc(path).delete(),12000);
        else await withTimeout(db.doc(path).set(body),12000);
        if(queue[path]===body) delete queue[path];
        saveLocal();
      }catch(e){
        if(e&&(e.code==="invalid_argument"||e.code==="transform_error")){ delete queue[path]; saveLocal(); continue; }
        if(e&&e.code==="quota_exceeded") toast("Storage is full. Delete some old trips in History.");
        setSync("off"); clearTimeout(retryTimer); retryTimer=setTimeout(flush,15000); return;
      }
    }
    setSync("ok");
  } finally { flushing=false; }
}
addEventListener("online",()=>{ clearTimeout(retryTimer); flush(); });

function applyRemote(kind, snap){
  if(kind==="state"){
    if("app/state" in queue) return;
    if(snap.exists){ const d=snap.data(); S.state=fixCats(Object.assign(defaultState(),JSON.parse(JSON.stringify(d)))); }
  } else {
    const coll = kind==="items"?S.items:S.trips, prefix=kind+"/";
    const next={};
    snap.docs.forEach(d=>{ next[d.id]=JSON.parse(JSON.stringify(d.data())); });
    for(const p in queue){ if(p.startsWith(prefix)){ const id=p.slice(prefix.length); if(queue[p]===null) delete next[id]; else next[id]=queue[p]; } }
    if(kind==="items") S.items=next; else S.trips=next;
  }
  saveLocal(); render();
}

function classify(key){
  const o=S.state.catOverrides[key];
  const hit=lookup(key);
  if(o) return {cat:o.cat, sec: o.sec || (hit&&hit.cat===o.cat?hit.sec:(CAT_SEC[o.cat]||"other"))};
  if(hit) return hit;
  // learned from history?
  const past=Object.values(S.trips).flatMap(t=>t.items).find(i=>i.key===key);
  if(past) return {cat:past.cat, sec:past.sec||CAT_SEC[past.cat]||"other"};
  return {cat:"other",sec:"other"};
}
function parseAisles(text){
  return String(text||"").split("\n").map(l=>{ const m=l.match(/^\s*(?:aisle\s*)?([A-Za-z]?\d+[A-Za-z]?)\s*[:\-–.]\s*(.+)$/i); if(!m) return null;
    const labels=m[2].split(/[,/&]| and /).map(s=>s.trim()).filter(Boolean);
    return {aisle:m[1].toUpperCase(), labels, phrases:labels.map(norm).filter(Boolean), words:new Set(labels.flatMap(x=>norm(x).split(" ")).filter(w=>w.length>2))}; }).filter(Boolean);
}
const aisleCache=new Map();
function aislesOf(st){ const k=st.id+"|"+st.aisles; if(!aisleCache.has(k)) aisleCache.set(k,parseAisles(st.aisles)); return aisleCache.get(k); }
function locate(it, st){
  const ov=(S.state.aisleOverrides[st.id]||{})[it.key];
  const map=aislesOf(st);
  if(ov) { const a=map.find(x=>x.aisle===ov); return {aisle:ov, label:a?a.labels.slice(0,2).join(", "):SECTIONS[it.sec||"other"][0], src:"set"}; }
  if(map.length){
    const k=" "+it.key+" ";
    let best=null,score=0;
    for(const a of map){ for(const ph of a.phrases){ if(k.includes(" "+ph+" ") && ph.length>score){ score=ph.length; best=a; } } }
    if(!best){ const sw=(SECTIONS[it.sec||"other"]||SECTIONS.other)[2].split(" ").map(sing);
      for(const a of map){ let s=0; for(const w of sw) if(a.words.has(w)) s++; if(s>score){score=s;best=a;} } }
    if(best) return {aisle:best.aisle, label:best.labels.slice(0,2).join(", "), src:"map"};
  }
  return {aisle:null, label:(SECTIONS[it.sec]||SECTIONS.other)[0], src:"est"};
}
function stats(){
  const by={};
  Object.values(S.trips).sort((a,b)=>a.at<b.at?-1:1).forEach(t=>t.items.forEach(i=>{
    const r=by[i.key]||(by[i.key]={key:i.key,name:i.name,cat:i.cat,sec:i.sec,dates:[]});
    r.name=i.name; r.cat=i.cat; r.sec=i.sec; const d=new Date(t.at).getTime(); if(r.dates[r.dates.length-1]!==d) r.dates.push(d);
  }));
  for(const r of Object.values(by)){
    const g=[]; for(let i=1;i<r.dates.length;i++) g.push((r.dates[i]-r.dates[i-1])/DAY);
    g.sort((a,b)=>a-b); r.every = g.length? g[Math.floor(g.length/2)] : null;
    r.last=r.dates[r.dates.length-1]; r.since=(Date.now()-r.last)/DAY; r.count=r.dates.length;
  }
  return by;
}
function suggestions(){
  const on=new Set(itemsArr().map(i=>i.key)), st=stats(), now=Date.now();
  return Object.values(st).filter(r=>r.count>=2 && r.every>=1 && !on.has(r.key) && r.since>=r.every*0.85 &&
      !(S.state.dismissed[r.key] && (now-S.state.dismissed[r.key])/DAY < Math.max(r.every,3)))
    .sort((a,b)=>(b.since/b.every)-(a.since/a.every)).slice(0,12);
}
const ago = d => d<1?"today":d<2?"yesterday":Math.round(d)+" days ago";
const every = d => d<1.5?"daily":d<10?"every ~"+Math.round(d)+" days":d<45?"every ~"+Math.round(d/7)+" weeks":"every ~"+Math.round(d/30)+" months";

let undoFn=null;
function addText(text, opts={}){
  let where="", whereName="";
  const pm=String(text).match(/^\s*([^:\n,()]{2,40}):\s*(\S[\s\S]*)$/);
  if(pm && !/\n/.test(text.trim())){
    const want=norm(pm[1]);
    let st=S.state.stores.find(s=>{ const n=norm(s.name); return n===want||n.includes(want)||want.includes(n); });
    if(!st){ st={id:uid(),name:pm[1].trim().replace(/\b\w/g,c=>c.toUpperCase()),aisles:"",secOrder:{},order:{}}; S.state.stores.push(st); putState(); }
    where=st.id; whereName=st.name; text=pm[2];
  }
  const parts=splitItems(text).filter(p=>!isHeaderLine(p)).map(parseItem).filter(Boolean);
  const added=[]; let dupe=null;
  for(const p of parts){
    const ex=itemsArr().find(i=>i.key===p.key && (i.where||"")===where);
    if(ex){ if(parts.length===1&&!opts.quiet) dupe=ex; else if(!opts.quiet){ dupe=ex; } continue; }
    const {cat,sec}=classify(p.key);
    const it={id:uid(),name:p.name,key:p.key,qty:p.qty,note:p.note,cat,sec,where,inCart:false,skipped:false,addedAt:Date.now()};
    putItem(it); added.push(it);
  }
  render();
  if(dupe && !added.length){ toast(dupe.name+" is already on your list", "Add 1 more", ()=>{ const it={...dupe,qty:bumpQty(dupe.qty)}; putItem(it); render(); toast(it.name+": "+it.qty); }); }
  else if(added.length){ const ids=added.map(a=>a.id);
    const msg = (added.length===1 ? "Added "+added[0].name+" to "+(whereName||catById(added[0].cat).name) : "Added "+added.length+" items"+(whereName?" for "+whereName:""))+(dupe?" (skipped duplicates)":"");
    toast(msg,"Undo",()=>{ ids.forEach(delItem); render(); }); }
  return added.length;
}
function setCategory(it, catId){
  const prev={...it};
  const sec = catId===it.cat ? it.sec : ((lookup(it.key)||{}).cat===catId ? lookup(it.key).sec : (CAT_SEC[catId]||"other"));
  S.state.catOverrides[it.key]={cat:catId, sec}; putState();
  putItem({...it,cat:catId,sec}); render();
  toast(it.name+" will go to "+catById(catId).name+" from now on","Undo",()=>{ delete S.state.catOverrides[it.key]; putState(); putItem(prev); render(); });
}

function costSheet(t){

    sh.appendChild(el('<label class="f">Amount paid (CAD)<div class="money"><span>$</span><input id="ecost" inputmode="decimal" placeholder="0.00" autocomplete="off"></div></label>'));

function learnOrder(st, picked){
  if(picked.length<2) return;
  const n=picked.length-1;
  st.order=st.order||{}; st.secOrder=st.secOrder||{};
  const secPos={};
  picked.forEach((it,i)=>{ const pos=i/n;
    st.order[it.key]= st.order[it.key]==null? pos : st.order[it.key]*0.6+pos*0.4;
    (secPos[it.sec]=secPos[it.sec]||[]).push(pos); });
  for(const s in secPos){ const avg=secPos[s].reduce((a,b)=>a+b,0)/secPos[s].length; st.secOrder[s]= st.secOrder[s]==null? avg : st.secOrder[s]*0.6+avg*0.4; }
}
function completeTrip({storeId,storeName,total,at}){
  let st=S.state.stores.find(s=>s.id===storeId);
  if(!st){ st={id:uid(),name:storeName,aisles:"",secOrder:{},order:{}}; S.state.stores.push(st); }
  const inCart=scopeItems(ui.stop||S.state.lastStoreId).filter(i=>i.inCart).sort((a,b)=>(a.pickedAt||0)-(b.pickedAt||0));
  const trip={id:uid(),at,storeId:st.id,storeName:st.name,total:Math.round(total*100)/100,
    items:inCart.map(i=>({key:i.key,name:i.name,qty:i.qty,note:i.note,cat:i.cat,sec:i.sec}))};
  learnOrder(st,inCart); if(!ui.stop||ui.stop===S.state.lastStoreId) S.state.lastStoreId=st.id; putState(); ui.stop=null;
  putTrip(trip);
  inCart.forEach(i=>delItem(i.id));
  itemsArr().filter(i=>i.skipped).forEach(i=>putItem({...i,skipped:false}));
  ui.pick={}; render();
  toast("Trip saved: "+inCart.length+" items, "+money(trip.total));
}

/* ---------- UI primitives ---------- */
let toastTimer=null; const undoStack=[];
function runUndo(){ const fn=undoStack.pop(); if(!fn) return; fn();
  if(undoStack.length){ const more=undoStack.pop(); toast("Undone","Undo",more); } else toast("Undone"); }
function toast(msg, ...acts){
  const actLabel=acts[0];
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status");
  t.innerHTML="<span>"+esc(msg)+"</span>";
  for(let i=0;i+1<acts.length;i+=2){ const label=acts[i], fn=acts[i+1]; const b=document.createElement("button"); b.textContent=label;
    if(label==="Undo"){ undoStack.push(fn); if(undoStack.length>5) undoStack.shift(); b.onclick=()=>{ t.remove(); runUndo(); }; }
    else b.onclick=()=>{ t.remove(); fn(); };
    t.appendChild(b); }
  document.body.appendChild(t); icons();
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(), actLabel?(acts.length>2?7000:5000):2600);
}
function sheet(title, build){
  closeSheet();
  const scrim=document.createElement("div"); scrim.className="scrim"; scrim.onclick=closeSheet;
  const sh=document.createElement("div"); sh.className="sheet wrap"; sh.setAttribute("role","dialog"); sh.setAttribute("aria-label",title);
  sh.innerHTML='<h3><span>'+esc(title)+'</span><button aria-label="Close">'+ic("x")+'</button></h3>';
  sh.querySelector("h3 button").onclick=closeSheet;
  build(sh);
  document.body.append(scrim,sh); icons();
  return sh;
}
function closeSheet(){ document.querySelectorAll(".scrim,.sheet").forEach(e=>e.remove()); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }

function swipeRow(rowEl, {left, right, leftLabel, rightLabel, tap, long}){
  const wrap=document.createElement("div"); wrap.className="swipe";
  const under=el('<div class="under"><span class="l">'+esc(rightLabel||"")+'</span><span class="r">'+esc(leftLabel||"")+'</span></div>');
  wrap.append(under,rowEl);
  let x0=null,y0=0,dx=0,locked=false,moved=false,pid=null;
  let lt=null, longed=false;
  rowEl.addEventListener("pointerdown",e=>{ if(e.button>0) return; x0=e.clientX; y0=e.clientY; dx=0; locked=false; moved=false; longed=false; pid=e.pointerId;
    clearTimeout(lt); if(long && !e.target.closest("[data-stop]")) lt=setTimeout(()=>{ if(!moved){ longed=true; x0=null; try{navigator.vibrate&&navigator.vibrate(20);}catch(_){} long(); } },500); });
  rowEl.addEventListener("contextmenu",e=>{ if(long) e.preventDefault(); });
  rowEl.addEventListener("pointermove",e=>{ if(x0===null||e.pointerId!==pid) return;
    const ddx=e.clientX-x0, ddy=e.clientY-y0;
    if(Math.abs(ddx)>8||Math.abs(ddy)>8) clearTimeout(lt);
    if(!locked){ if(Math.abs(ddy)>10&&Math.abs(ddy)>Math.abs(ddx)){ x0=null; return; } if(Math.abs(ddx)>10){ locked=true; try{rowEl.setPointerCapture(pid);}catch(_){} } }
    if(locked){ moved=true; dx=ddx; if((dx>0&&!right)||(dx<0&&!left)) dx=dx/4; rowEl.style.transform="translateX("+dx+"px)"; }
  });
  const end=e=>{ clearTimeout(lt); if(x0===null) return; x0=null; rowEl.style.transition="transform .18s"; rowEl.style.transform="";
    setTimeout(()=>rowEl.style.transition="",200);
    if(moved){ if(dx<-90&&left) left(); else if(dx>90&&right) right(); }
  };
  rowEl.addEventListener("pointerup",end); rowEl.addEventListener("pointercancel",()=>{x0=null;rowEl.style.transform="";});
  rowEl.addEventListener("click",e=>{ if(longed){ e.preventDefault(); longed=false; return; } if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; return; } if(tap && !e.target.closest("[data-stop]")) tap(e); });
  return wrap;
}

function shopGroups(items, st, byCat){
  const groups=new Map();
  for(const it of items){
    let key,title,tag,sortv;
    if(byCat){ const c=catById(it.cat); key="c:"+c.id; title=c.name; tag=null; sortv=cats().indexOf(c); }
    else {
      const loc=locate(it,st);
      if(loc.aisle){ key="a:"+loc.aisle; title="Aisle "+loc.aisle+(loc.label?" · "+loc.label:""); tag=null; }
      else { key="s:"+(it.sec||"other"); title=loc.label; tag="~"; }
      const so=(st.secOrder||{})[it.sec];
      const num=loc.aisle? parseInt(loc.aisle.replace(/\D/g,""),10):NaN;
      sortv = so!=null ? so : !isNaN(num) ? 0.12+num/100 : ((SECTIONS[it.sec]||SECTIONS.other)[1])/23;
    }
    if(!groups.has(key)) groups.set(key,{key,title,tag,items:[],sv:[],cat:catById(it.cat)});
    const g=groups.get(key); g.items.push(it); g.sv.push(sortv);
  }
  const out=[...groups.values()];
  out.forEach(g=>{ g.sort=g.sv.reduce((a,b)=>a+b,0)/g.sv.length;
    const cnt={}; g.items.forEach(i=>{ cnt[i.cat]=(cnt[i.cat]||0)+1; }); g.cat=catById(Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]);
    g.items.sort((a,b)=>((st.order||{})[a.key]??0.5)-((st.order||{})[b.key]??0.5)||a.name.localeCompare(b.name)); });
  return out.sort((a,b)=>a.sort-b.sort);
}

    fb.onclick=()=>{ if(fav) delete S.state.favorites[it.key]; else S.state.favorites[it.key]={name:it.name,cat:it.cat}; putState(); save(true); toast(fav?"Removed from favorites":"Added to favorites"); };

    function save(close){
      const name=q("#e-name").value.trim()||it.name;
      const n={...it,name,key:norm(name)||it.key,qty:q("#e-qty").value.trim(),note:q("#e-note").value.trim(),where:w.value};
      if(n.key!==it.key){ const c2=classify(n.key); if(!S.state.catOverrides[it.key]){ n.cat=c2.cat; n.sec=c2.sec; } }
      putItem(n); if(close){ closeSheet(); } render();
    }
  });
}
function pickCategory(it){
  sheet("Category for "+it.name, sh=>{
    const g=el('<div class="catgrid"></div>');
    cats().forEach(c=>{ const b=el('<button aria-pressed="'+(c.id===it.cat)+'">'+ctile(c,true)+'<span>'+esc(c.name)+'</span></button>');
      b.onclick=()=>{ closeSheet(); if(c.id!==it.cat) setCategory(it,c.id); }; g.appendChild(b); });
    sh.appendChild(g);
    sh.appendChild(el('<p class="hint">The app remembers this for "'+esc(it.name)+'" next time.</p>'));
  });
}
function pickStore(){ ui.stop=null;
  sheet("Where are you shopping?", sh=>{
    const p=el('<div class="storepick"></div>');
    S.state.stores.forEach(s=>{ const b=el('<button aria-pressed="'+(s.id===S.state.lastStoreId)+'">'+esc(s.name)+'</button>'); b.onclick=()=>{ S.state.lastStoreId=s.id; putState(); closeSheet(); render(); }; p.appendChild(b); });
    sh.appendChild(p);
    const f=el('<form class="addrow"><input class="inp" style="flex:1;min-width:0" placeholder="New store, e.g. Walmart Kingsway" id="ns"><button class="btn">Add</button></form>');
    f.onsubmit=e=>{ e.preventDefault(); const n=f.querySelector("input").value.trim(); if(!n) return; const s={id:uid(),name:n,aisles:"",secOrder:{},order:{}}; S.state.stores.push(s); S.state.lastStoreId=s.id; putState(); closeSheet(); render(); };
    sh.appendChild(f);
  });
}
function setAisle(it, st){
  const cur=(S.state.aisleOverrides[st.id]||{})[it.key]||"";
  sheet("Aisle for "+it.name, sh=>{
    sh.appendChild(el('<p class="muted" style="margin:0">At '+esc(st.name)+'. Next time, '+esc(it.name)+' will sort into this aisle.</p>'));
    const f=el('<form class="addrow"><input class="inp" style="flex:1;min-width:0;font-size:1.4em" inputmode="text" placeholder="e.g. 5" id="aislein"><button class="btn">Save</button></form>');
    f.querySelector("input").value=cur;
    f.onsubmit=e=>{ e.preventDefault(); const a=f.querySelector("input").value.trim().toUpperCase().replace(/^AISLE\s*/,"");
      const m=S.state.aisleOverrides[st.id]=S.state.aisleOverrides[st.id]||{};
      if(a) m[it.key]=a; else delete m[it.key];
      putState(); closeSheet(); render(); toast(a? it.name+" set to aisle "+a : "Aisle cleared"); };
    sh.appendChild(f);
    setTimeout(()=>f.querySelector("input").focus(),60);
  });
}
function completeSheet(){
  const scope=scopeItems(ui.stop||S.state.lastStoreId);
  const inCart=scope.filter(i=>i.inCart);
  let chosen=ui.stop||S.state.lastStoreId;
  sheet("Complete trip", sh=>{
    const p=el('<div class="storepick"></div>');
    const draw=()=>{ p.replaceChildren(); S.state.stores.forEach(s=>{ const b=el('<button type="button" aria-pressed="'+(s.id===chosen)+'">'+esc(s.name)+'</button>'); b.onclick=()=>{ chosen=s.id; draw(); }; p.appendChild(b); }); };
    draw();
    sh.appendChild(el('<label class="f" style="margin-bottom:-6px">Store</label>')); sh.appendChild(p);
    sh.appendChild(el('<label class="f">Total paid (CAD)<div class="money"><span>$</span><input id="tot" inputmode="decimal" placeholder="0.00" autocomplete="off"></div></label>'));
    const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
    sh.appendChild(el('<label class="f">Date and time<input type="datetime-local" id="when" value="'+d.toISOString().slice(0,16)+'"></label>'));
    const rc=el('<div class="receipt"></div>');
    inCart.forEach(i=>rc.appendChild(el('<div><span>'+esc(i.name)+'</span><span>'+esc(i.qty||"1")+'</span></div>')));
    sh.appendChild(rc);
    const left=scope.filter(i=>!i.inCart).length;
    if(left) sh.appendChild(el('<p class="hint" style="margin:0">'+left+' item'+(left===1?"":"s")+' not in your cart will stay on the list.</p>'));
    const err=el('<p class="hint" style="color:var(--danger);margin:0" hidden></p>'); sh.appendChild(err);
    const skipB=el('<button class="link" style="align-self:center">Skip total for now</button>');
    skipB.onclick=()=>{ const w=sh.querySelector("#when").value; closeSheet(); completeTrip({storeId:chosen, storeName:store(chosen).name, total:0, at:w?new Date(w).toISOString():new Date().toISOString()}); };
    const b=el('<button class="btn wide">Save trip</button>');
    b.onclick=()=>{ const t=parseFloat(String(sh.querySelector("#tot").value).replace(/[$,\s]/g,""));
      if(!(t>=0)){ err.textContent="Enter the total from your receipt, like 84.37."; err.hidden=false; return; }
      const w=sh.querySelector("#when").value; const at=w? new Date(w).toISOString() : new Date().toISOString();
      closeSheet(); completeTrip({storeId:chosen, storeName:store(chosen).name, total:t, at}); };
    sh.appendChild(b); sh.appendChild(skipB);
    setTimeout(()=>sh.querySelector("#tot").focus(),80);
  });
}
function tripSheet(t){
  sheet(new Date(t.at).toLocaleString("en-CA",{weekday:"long",month:"long",day:"numeric",hour:"numeric",minute:"2-digit"}), sh=>{
    sh.appendChild(el('<div class="grid2"><label class="f">Store<select id="ts"></select></label><label class="f">Total (CAD)<input id="tt" inputmode="decimal"></label></div>'));
    const s=sh.querySelector("#ts"); S.state.stores.forEach(x=>s.appendChild(new Option(x.name,x.id)));
    if(!S.state.stores.some(x=>x.id===t.storeId)) s.appendChild(new Option(t.storeName,t.storeId));
    s.value=t.storeId; const tt=sh.querySelector("#tt"); tt.value=t.total.toFixed(2);
    const card=el('<div class="rows"></div>');
    t.items.forEach(i=>{ const r=el('<div class="row">'+ctile(catById(i.cat))+'<div class="main"><div class="name">'+(i.qty?'<span class="qty">'+esc(i.qty)+'</span>':'')+esc(i.name)+'</div>'+(i.note?'<div class="sub">'+esc(i.note)+'</div>':'')+'</div><button class="mini">+ List</button></div>');
      r.querySelector("button").onclick=()=>{ addText((i.qty?i.qty+" ":"")+i.name); }; card.appendChild(r); });
    sh.appendChild(card);
    const row=el('<div class="grid2"><button class="btn danger">Delete trip</button><button class="btn">Save</button></div>');
    let armed=false;
    row.firstElementChild.onclick=e=>{ if(!armed){ armed=true; e.target.textContent="Tap again to delete"; return; } closeSheet(); const keep={...t}; delTrip(t.id); render(); toast("Trip deleted","Undo",()=>{ putTrip(keep); render(); }); };
    row.lastElementChild.onclick=()=>{ const st=S.state.stores.find(x=>x.id===s.value); const tot=parseFloat(tt.value.replace(/[$,]/g,""));
      putTrip({...t,storeId:s.value,storeName:st?st.name:t.storeName,total:tot>=0?Math.round(tot*100)/100:t.total}); closeSheet(); render(); toast("Trip updated"); };
    sh.appendChild(row);
  });
}
function storeSheet(st){
  const isNew=!st;
  sheet(isNew?"Add a store":st.name, sh=>{
    sh.appendChild(el('<label class="f">Store name<input id="sn" placeholder="e.g. Superstore Calgary Trail"></label>'));
    sh.appendChild(el('<label class="f">Aisle map, one aisle per line<textarea id="sa" placeholder="1: Produce&#10;5: Pasta, Sauces, Canned tomatoes&#10;6: Jam, Peanut butter, Condiments"></textarea></label>'));
    sh.querySelector("#sn").value=st?st.name:""; sh.querySelector("#sa").value=st?st.aisles:"";
    const ph=el('<div class="line"><span class="muted">Photograph the signs over each aisle and the app writes this map for you. This uses a little of your Claude usage.</span><label class="mini" style="cursor:pointer">Read signs<input type="file" accept="image/*" multiple hidden id="signs"></label></div>');
    ph.querySelector("input").onchange=e=>readSigns(e.target.files, sh.querySelector("#sa"), e.target);
    sampleImages().then(ok=>{ if(!ok) ph.hidden=true; });
    sh.appendChild(ph);
    sh.appendChild(el('<p class="hint" style="margin:0">Without a map, items sort by estimated store section, and the app learns your walking order from the order you check items off.</p>'));
    const row=el('<div class="grid2"><button class="btn ghost">'+(isNew?"Cancel":"Delete store")+'</button><button class="btn">Save</button></div>');
    let armed=false;
    row.firstElementChild.onclick=e=>{ if(isNew){ closeSheet(); return; } if(S.state.stores.length<2){ toast("Keep at least one store"); return; }
      if(!armed){ armed=true; e.target.textContent="Tap again to delete"; return; }
      S.state.stores=S.state.stores.filter(x=>x.id!==st.id); if(S.state.lastStoreId===st.id) S.state.lastStoreId=S.state.stores[0].id; putState(); closeSheet(); render(); };
    row.lastElementChild.onclick=()=>{ const name=sh.querySelector("#sn").value.trim(); if(!name){ toast("Give the store a name"); return; }
      const aisles=sh.querySelector("#sa").value.trim();
      if(isNew) S.state.stores.push({id:uid(),name,aisles,secOrder:{},order:{}}); else { st.name=name; st.aisles=aisles; }
      putState(); closeSheet(); render(); toast("Store saved"+(parseAisles(aisles).length?" · "+parseAisles(aisles).length+" aisles":"")); };
    sh.appendChild(row);
  });
}
function styleSheet(c){
  sheet(c.name, sh=>{
    const nf=el('<label class="f">Name<input id="catname"></label>'); nf.querySelector("input").value=c.name;
    nf.querySelector("input").onchange=e=>{ c.name=e.target.value.trim()||c.name; putState(); render(); };
    sh.appendChild(nf);
    sh.appendChild(el('<label class="f" style="margin-bottom:-6px">Icon</label>'));
    const g=el('<div class="catgrid" style="grid-template-columns:repeat(6,1fr)"></div>');
    ICONS.forEach(([n,l])=>{ const b=el('<button aria-label="'+l+'" aria-pressed="'+(c.icon===n)+'" style="justify-content:center;padding:10px 0">'+ic(n)+'</button>'); b.onclick=()=>{ c.icon=n; putState(); render(); styleSheet(c); }; g.appendChild(b); });
    sh.appendChild(g);
    sh.appendChild(el('<label class="f" style="margin-bottom:-6px">Colour</label>'));
    const cg=el('<div class="catgrid" style="grid-template-columns:repeat(7,1fr)"></div>');
    FOREST.forEach(([l,h])=>{ const b=el('<button aria-label="'+l+'" aria-pressed="'+(c.color===h)+'" style="height:40px;padding:0;background:'+h+'"></button>'); b.onclick=()=>{ c.color=h; putState(); render(); styleSheet(c); }; cg.appendChild(b); });
    sh.appendChild(cg);
    const mb=el('<button class="btn ghost wide">Merge or delete…</button>'); mb.onclick=()=>catSheet(c); sh.appendChild(mb);
  });
}
function catSheet(c){
  sheet(c.name, sh=>{
    const others=cats().filter(x=>x.id!==c.id);
    sh.appendChild(el('<label class="f">Merge into another category<select id="mg"><option value="">Choose…</option></select></label>'));
    const mg=sh.querySelector("#mg"); others.forEach(o=>mg.appendChild(new Option(o.name,o.id)));
    const b1=el('<button class="btn ghost wide">Merge</button>');
    b1.onclick=()=>{ if(!mg.value) return; moveCat(c.id,mg.value); closeSheet(); toast("Merged into "+catById(mg.value).name); };
    sh.appendChild(b1);
    if(c.id!=="other"){ const b2=el('<button class="btn danger wide">Delete category</button>'); let armed=false;
      b2.onclick=()=>{ if(!armed){ armed=true; b2.textContent="Tap again: items move to Other"; return; } moveCat(c.id,"other"); closeSheet(); toast("Category deleted"); };
      sh.appendChild(b2); }
  });
}
function moveCat(from,to){
  itemsArr().filter(i=>i.cat===from).forEach(i=>putItem({...i,cat:to}));
  for(const k in S.state.catOverrides) if(S.state.catOverrides[k].cat===from) S.state.catOverrides[k].cat=to;
  S.state.categories=cats().filter(x=>x.id!==from); putState(); render();
}
function wipeSheet(){
  sheet("Delete all data?", sh=>{
    sh.appendChild(el('<p style="margin:0">This removes your list, every trip in History, your stores and aisle maps, and everything the app has learned. Export a backup first if you might want it back.</p>'));
    const b=el('<button class="btn danger wide">Delete everything</button>');
    b.onclick=()=>{ Object.keys(S.items).forEach(delItem); Object.keys(S.trips).forEach(delTrip); S.state=defaultState(); putState(); closeSheet(); render(); toast("All data deleted"); };
    sh.appendChild(b);
  });
}

/* ---------- Claude-powered reading (images) ---------- */
let imgCaps=null;
async function sampleImages(){ if(!sample) return false; if(imgCaps===null){ imgCaps = await sample.limits().catch(()=>null); } return !!(imgCaps&&imgCaps.images); }
const SAMPLE_ERR={rate_limited:"Claude usage limit reached. Try again later.",not_granted:"Allow this page to use Claude, then try again.",images_unavailable:"Image reading isn't available here.",image_rejected:"That image couldn't be read. Try a PNG or JPG.",cancelled:"Cancelled."};
async function readScreenshot(file, input){
  if(!file) return; input.value="";
  toast("Reading your screenshot…");
  try{
    const res=await sample.json('The attached image is a screenshot of a shopping list, from a notes app or a text message conversation. Extract only the items to buy. Ignore headings and category titles, timestamps, sender names and conversation. Return a JSON array of objects: {"name": string, "qty": string or null, "note": string or null}. Keep the item names as written.',{images:[file]});
    const arr=Array.isArray(res)?res:(res&&res.items)||[];
    const lines=arr.filter(x=>x&&x.name).map(x=>(x.qty?x.qty+" ":"")+x.name+(x.note?" ("+x.note+")":""));
    if(!lines.length){ toast("No list items found in that image"); return; }
    const n=addText(lines.join("\n"),{quiet:true});
    toast(n? "Added "+n+" items from the screenshot" : "Everything in that screenshot is already on your list");
  }catch(e){ toast(SAMPLE_ERR[e&&e.code]||"Couldn't read that image. Try again, or paste the text instead."); }
}
async function readSigns(files, ta, input){
  if(!files||!files.length) return;
  const max=(imgCaps&&imgCaps.images&&imgCaps.images.maxCount)||5;
  const list=[...files].slice(0,max); input.value="";
  toast("Reading "+list.length+" sign photo"+(list.length>1?"s":"")+"…");
  try{
    const res=await sample.json('These photos show the signs hanging over aisles in a grocery store. For each aisle sign, give the aisle number or code and the product words printed on it. Return a JSON array of objects: {"aisle": string, "labels": string[]}. One entry per aisle; merge duplicates. Skip anything that is not an aisle sign.',{images:list});
    const arr=Array.isArray(res)?res:(res&&res.aisles)||[];
    const cur=parseAisles(ta.value), have=new Set(cur.map(a=>a.aisle));
    const add=arr.filter(a=>a&&a.aisle&&Array.isArray(a.labels)&&a.labels.length&&!have.has(String(a.aisle).toUpperCase()))
      .map(a=>String(a.aisle).toUpperCase().replace(/^AISLE\s*/,"")+": "+a.labels.join(", "));
    ta.value=[ta.value.trim(),...add].filter(Boolean).join("\n");
    toast(add.length? "Found "+add.length+" aisles. Check them, then tap Save." : "No new aisle signs found in those photos");
  }catch(e){ toast(SAMPLE_ERR[e&&e.code]||"Couldn't read those photos. Try again with clearer shots."); }
}

/* ---------- Backup ---------- */
async function exportData(){
  const data=JSON.stringify({app:"errands",exported:new Date().toISOString(),state:S.state,items:S.items,trips:S.trips},null,1);
  const name="errands-backup-"+new Date().toISOString().slice(0,10)+".json";
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    prefs({lastBackup:Date.now()}); toast("Backup saved to your Downloads"); return; }catch(e){}
  try{ await navigator.clipboard.writeText(data); prefs({lastBackup:Date.now()}); toast("Backup copied to the clipboard. Paste it into a note to keep it."); }
  catch(e){ toast("Saving files isn't available here."); }
}
function importBackup(file){
  if(!file) return;
  file.text().then(txt=>{ const d=JSON.parse(txt); if(!d||!["errands","grocery-list"].includes(d.app)||!d.state) throw 0;
    S.state=Object.assign(defaultState(),d.state); putState();
    Object.values(d.items||{}).forEach(putItem); Object.values(d.trips||{}).forEach(putTrip);
    render(); toast("Backup restored"); }).catch(()=>toast("That file isn't an Errands backup."));
}

/* ---------- Misc ---------- */
function prefs(p){ lsSet("gp.prefs",Object.assign(lsGet("gp.prefs")||{},p)); }
let lock=null;
async function wake(on){
  try{
    if(on && !lock && navigator.wakeLock && document.visibilityState==="visible"){ lock=await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>{lock=null;}); }
    if(!on && lock){ await lock.release(); lock=null; }
  }catch(e){ lock=null; }
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") wake(ui.tab==="shop"); });

function renderRecent(){
  const box=document.getElementById("recent"), inp=document.getElementById("addinput");
  const q=norm(inp.value.split(",").pop());
  box.replaceChildren();
  if(!q || ui.tab!=="list"){ box.hidden=true; return; }
  const on=new Set(itemsArr().map(i=>i.key));
  const pool=new Map();
  Object.values(stats()).sort((a,b)=>b.count-a.count).forEach(r=>pool.set(r.key,r.name));
  Object.entries(S.state.favorites).forEach(([k,f])=>pool.set(k,f.name));
  const hits=[...pool].filter(([k])=>!on.has(k)&&k!==q&&(k.startsWith(q)||k.split(" ").some(w=>w.startsWith(q)))).slice(0,5);
  box.hidden=!hits.length;
  hits.forEach(([k,name])=>{ const b=el('<button type="button">'+esc(name)+'</button>');
    b.onclick=()=>{ const parts=inp.value.split(","); parts.pop(); inp.value=parts.join(","); if(inp.value.trim()) addText(inp.value); inp.value=""; addText(name); renderRecent(); inp.focus(); };
    box.appendChild(b); });
}
document.getElementById("addinput").addEventListener("input",renderRecent);
document.getElementById("addform").addEventListener("submit",e=>{
  e.preventDefault(); const inp=document.getElementById("addinput");
  if(inp.value.trim()){ addText(inp.value); inp.value=""; renderRecent(); }
  inp.focus();
});
document.getElementById("addinput").addEventListener("paste",e=>{
  const t=(e.clipboardData||window.clipboardData).getData("text");
  if(t && t.includes("\n")){ e.preventDefault(); const n=addText(t,{quiet:true}); toast(n?"Added "+n+" items":"No new items in what you pasted"); }
});
document.getElementById("search").addEventListener("input",e=>{ ui.search=e.target.value; render(); });
document.getElementById("searchbtn").onclick=()=>{ ui.searchOpen=!ui.searchOpen; if(!ui.searchOpen){ ui.search=""; document.getElementById("search").value=""; } render(); if(ui.searchOpen) document.getElementById("search").focus(); };
document.getElementById("completebtn").onclick=completeSheet;

function route(){ const h=location.hash.slice(1); ui.tab=["list","shop","history","setup"].includes(h)?h:"list"; closeSheet(); render(); }
addEventListener("hashchange",route);
route();

/* ---------- Keep data safe (standalone) ---------- */
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
(function backupReminder(){
  const p=lsGet("gp.prefs")||{}, now=Date.now(), D=864e5;
  if(!p.firstUse){ prefs({firstUse:now}); return; }
  const has=Object.keys(S.items).length+Object.keys(S.trips).length>=5;
  if(has && now-Math.max(p.lastBackup||0,p.firstUse)>21*D && now-(p.remindedAt||0)>7*D){
    prefs({remindedAt:now});
    setTimeout(()=>toast("It's been a while. Back up your list?","Back up",exportData),1500);
  }
})();

/* ---------- Connect to the artifact's storage (accounts: see sync.js) ---------- */
if(!(window.claude&&claude.use)){ setSync("local"); render(); } else (async()=>{
  setSync("busy");
  try{
    if(window.claude&&claude.use){
      [db, sample, downloads] = await Promise.all([claude.use("db"),claude.use("sample"),claude.use("downloads")]);
    }
  }catch(e){}
  if(!db){ setSync("local"); render(); return; }
  let firstState=true, loaded=false;
  const slow=setTimeout(()=>{ if(!loaded) setSync("off"); },10000);
  db.doc("app/state").onSnapshot(s=>{
    if(!s.metadata.fromCache){ loaded=true; clearTimeout(slow); }
    if(firstState && !s.metadata.fromCache){ firstState=false;
      if(!s.exists && !("app/state" in queue)) putState();   // first run: save default categories and store
    }
    applyRemote("state",s);
  },()=>setSync("off"));
  db.collection("items").onSnapshot(s=>applyRemote("items",s),()=>setSync("off"));
  db.collection("trips").onSnapshot(s=>applyRemote("trips",s),()=>setSync("off"));
  flush();
  render();
})();
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
